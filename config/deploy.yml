service: jefbe
image: jefvlamings/jef.be

servers:
  web:
    hosts:
      - web02.frontier.be
    options:
      pull: never
      memory: 64m

ssh:
  user: deploy

# Shared private registry on web01 (infrastructure: hosts/web01/README.md).
registry:
  server: registry.frontier.be
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

retain_containers: 3

# Build on web02 itself (build02.frontier.be). Keep this remote string
# identical across the web02 apps so they share one BuildKit builder and cache.
# local: false is required: Kamal otherwise builds on the deployer's machine
# whenever its architecture matches (amd64).
builder:
  arch: amd64
  local: false
  remote: ssh://deploy@build02.frontier.be

# web02's nginx terminates TLS (its own ACME certificate for jef.be) and proxies
# to kamal-proxy on loopback. The run block is shared by every app on web02 and
# must stay identical.
proxy:
  host: jef.be
  app_port: 80
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
  run:
    bind_ips:
      - 127.0.0.1
    http_port: 18080
    https_port: 18443
