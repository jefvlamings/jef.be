# Runs behind web02's nginx (TLS, redirects to the canonical host, security
# rules) and kamal-proxy. Serves only the files in public/.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers: the public scheme and host are not visible here.
    absolute_redirect off;

    # kamal-proxy health check.
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        # Clean URLs: /page.html redirects to /page, which serves page.html.
        if ($request_uri ~ ^/(.*)\.html$) {
            return 302 /$1;
        }
        try_files $uri $uri.html $uri/ =404;

        location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|svg)$ {
            expires 30d;
        }
    }
}
