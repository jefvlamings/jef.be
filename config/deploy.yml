service: jefbe
image: jefvlamings/jef.be

servers:
  web:
    hosts:
      - web01.frontier.be
    options:
      pull: never
      memory: 64m

ssh:
  user: deploy

# Shared private registry on web01 (infrastructure: hosts/web01/README.md).
registry:
  server: registry.frontier.be
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

retain_containers: 3

# Build on web01 itself (build01.frontier.be, arm64). Keep this remote string
# identical across the web01 apps so they share one BuildKit builder and cache.
builder:
  arch: arm64
  remote: ssh://deploy@build01.frontier.be

# web01's nginx terminates TLS (its own ACME certificate for jef.be) and proxies
# to kamal-proxy on loopback. The run block is shared by every app on web01 and
# must stay identical.
proxy:
  host: jef.be
  app_port: 80
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
  run:
    bind_ips:
      - 127.0.0.1
    http_port: 18080
    https_port: 18443
